<!DOCTYPE html>
<html>
<head>
    <title>Сайт</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
        }
        .container{max-width:500px;margin:0 auto;}
        .menu{
            background: white;
            padding: 15px;
            border-radius: 50px;
            margin-bottom: 20px;
            text-align: center;
        }
        .menu a{
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        .card{
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2{text-align:center;color:#333;margin-bottom:20px;}
        input{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        input[type="submit"]{
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover{opacity:0.9;}
        .avatar{
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
        }
        .username{
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .btn{
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            margin: 5px;
        }
        .btn-secondary{
            background: #f0f0f0;
            color: #333;
        }
        .btn-danger{
            background: #ff4757;
            color: white;
        }
        p{text-align:center;}
        a{color:#667eea;}

        .error{
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f5c6cb;
        }
        .success{
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #c3e6cb;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <a href="/">🏠 Главная</a>
            {% if session.user %}
                <a href="/profile">👤 Профиль</a>
                <a href="/logout">🚪 Выйти</a>
            {% else %}
                <a href="/login">🔑 Войти</a>
                <a href="/register">📝 Регистрация</a>
            {% endif %}
        </div>
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
